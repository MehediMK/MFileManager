[package]
name = "file-manager"
version = "0.1.0"
edition = "2024"
description = "A fast, modern file manager for Ubuntu/Linux built with Rust and Tauri 2"
license = "MIT"
repository = "https://github.com/your-username/file-manager"
homepage = "https://github.com/your-username/file-manager"
keywords = ["file-manager", "tauri", "linux", "gui", "file-explorer"]
categories = ["filesystem", "gui"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
log = "0.4.34"
mime_guess = "2.0.5"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"
tauri = "2.11.6"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-http = "2.7.0"
tauri-plugin-log = "2.9.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.6"
tokio = { version = "1.53.1", features = ["full"] }
trash = "5.2.9"
walkdir = "2.5.0"

[build-dependencies]
tauri-build = "2.6.3"